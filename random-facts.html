<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interesting Random Facts</title>
  <meta name="description" content="A colorful mobile-friendly page that shows interesting random facts with related images." />
  <style>
    :root{
      --bg1:#ff9a9e;
      --bg2:#fad0c4;
      --card:#ffffff;
      --accent1:#6a11cb;
      --accent2:#2575fc;
      --btn-text:#fff;
    }
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,system-ui,-apple-system,"Helvetica Neue",Arial;color:#111;background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;padding:24px}

    /* Phone-like canvas */
    .phone{
      width:380px;max-width:92vw;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(255,255,255,0.9));box-shadow:0 18px 40px rgba(10,10,20,0.18);overflow:hidden;border:6px solid rgba(255,255,255,0.5);
    }

    header{padding:18px 18px 6px;text-align:center}
    h1{margin:0;font-size:1.25rem;line-height:1.05;background:linear-gradient(90deg,var(--accent1),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:0.2px}

    .image-wrap{width:100%;height:220px;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .image-wrap img{width:100%;height:100%;object-fit:cover;display:block}

    .content{padding:18px}
    .fact-card{background:var(--card);padding:16px;border-radius:14px;box-shadow:0 8px 22px rgba(20,20,30,0.06);min-height:92px;display:flex;align-items:center;justify-content:center}
    .fact-card p{margin:0;font-size:1rem;text-align:center;color:#111}

    .controls{display:flex;gap:12px;justify-content:center;padding:14px}
    .btn{border:0;padding:12px 18px;border-radius:12px;color:var(--btn-text);cursor:pointer;font-weight:700;background:linear-gradient(90deg,var(--accent1),var(--accent2));box-shadow:0 8px 22px rgba(40,30,120,0.12)}
    .btn:active{transform:translateY(1px)}

    /* small screens: keep phone centered, allow full width */
    @media (max-width:420px){
      .phone{width:94vw;border-radius:20px}
      .image-wrap{height:180px}
    }
  </style>
</head>
<body>
  <div class="phone" role="main" aria-label="Interesting Random Facts">
    <header>
      <h1>Interesting Random Facts</h1>
    </header>

    <div class="image-wrap">
      <img id="fact-img" src="https://source.unsplash.com/720x480/?nature" alt="Fact related image"/>
    </div>

    <div class="content">
      <div id="fact" class="fact-card" aria-live="polite">
        <p id="fact-text">Loading a fun fact...</p>
      </div>
    </div>

    <div class="controls">
      <button id="newBtn" class="btn">Show another fact</button>
    </div>
  </div>

  <script>
    // Facts with concise tags to request related images
    const facts = [
      { text: "Honey never spoils — archaeologists have found edible honey in ancient Egyptian tombs over 3,000 years old.", tag: "honey,ancient egypt" },
      { text: "Octopuses have three hearts and blue blood.", tag: "octopus,marine" },
      { text: "Bananas are berries, but strawberries aren't.", tag: "banana,fruit" },
      { text: "There are more possible iterations of a game of chess than atoms in the known universe.", tag: "chess,board game" },
      { text: "A day on Venus is longer than a year on Venus.", tag: "venus,space" },
      { text: "Wombat poop is cube-shaped — this helps it not to roll away.", tag: "wombat,animal,australia" },
      { text: "A single strand of spaghetti is called a 'spaghetto'.", tag: "spaghetti,pasta" },
      { text: "Cleopatra lived closer in time to the Moon landing than to the Great Pyramid of Giza.", tag: "cleopatra,egypt,history" }
    ];

    const factText = document.getElementById('fact-text');
    const factImg = document.getElementById('fact-img');
    const newBtn = document.getElementById('newBtn');

    function getRandomIndex(){
      return Math.floor(Math.random() * facts.length);
    }

    function showFact(idx){
      const i = (typeof idx === 'number') ? idx : getRandomIndex();
      const fact = facts[i];

      // text transition
      factText.style.opacity = '0';
      setTimeout(()=>{
        factText.textContent = fact.text;
        factText.style.opacity = '1';
      }, 120);

      // request a related image from Unsplash using the tag keywords
      const q = encodeURIComponent(fact.tag || fact.text.split(' ').slice(0,3).join(' '));
      // Use a fixed size to better fit the phone canvas
      factImg.src = `https://source.unsplash.com/720x480/?${q}`;
      factImg.alt = fact.text.slice(0,80) + (fact.text.length>80? '...' : '');

      // update hash (optional)
      const url = new URL(window.location.href);
      url.hash = 'fact=' + i;
      history.replaceState(null, '', url);
    }

    newBtn.addEventListener('click', ()=> showFact());

    // spacebar also shows a new fact
    window.addEventListener('keydown', (e)=>{ if(e.code === 'Space'){ e.preventDefault(); showFact(); } });

    // load initial
    window.addEventListener('load', ()=>{
      const hash = location.hash.replace('#','');
      const params = new URLSearchParams(hash);
      if(params.has('fact')){
        const idx = parseInt(params.get('fact'), 10);
        if(!isNaN(idx) && idx >=0 && idx < facts.length) return showFact(idx);
      }
      showFact();
    });

    factImg.addEventListener('error', ()=>{ factImg.src = 'https://picsum.photos/720/480?random=1'; });
  </script>
</body>
</html>
