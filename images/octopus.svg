<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">Lifelike Octopus Illustration</title>
  <desc id="desc">A stylized but lifelike octopus with textured mantle, articulated tentacles, and subtle lighting and shadow for depth.</desc>

  <defs>
    <!-- Body radial shading -->
    <radialGradient id="gMantle" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#9a3f57"/>
      <stop offset="45%" stop-color="#7c2e45"/>
      <stop offset="100%" stop-color="#4d1b2a"/>
    </radialGradient>

    <!-- Subtle specular highlight -->
    <radialGradient id="gShine" cx="35%" cy="25%" r="40%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Tentacle fill -->
    <linearGradient id="gTent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a2b45"/>
      <stop offset="50%" stop-color="#8f3c57"/>
      <stop offset="100%" stop-color="#5b2130"/>
    </linearGradient>

    <!-- Sucker gradient -->
    <radialGradient id="gSucker" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffecec"/>
      <stop offset="60%" stop-color="#d6aeb5"/>
      <stop offset="100%" stop-color="#a9747a"/>
    </radialGradient>

    <!-- Eye gradient -->
    <radialGradient id="gEye" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#dfefff"/>
      <stop offset="100%" stop-color="#b0c6d8"/>
    </radialGradient>

    <!-- Drop shadow -->
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset in="blur" dx="0" dy="22" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gentle texture overlay -->
    <pattern id="texture" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="transparent"/>
      <path d="M0 30 Q15 25 30 30 T60 30" stroke="rgba(0,0,0,0.03)" stroke-width="1" fill="none"/>
      <path d="M0 45 Q15 40 30 45 T60 45" stroke="rgba(255,255,255,0.02)" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <!-- Ambient sea background -->
  <rect width="100%" height="100%" fill="#0d2b35"/>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#gShine)" opacity="0.06"/>

  <!-- Ground shadow -->
  <ellipse cx="520" cy="640" rx="300" ry="70" fill="#001217" opacity="0.45"/>

  <!-- Group with drop shadow for entire octopus -->
  <g filter="url(#drop)" transform="translate(60,30)">

    <!-- Tentacles (back ones first) -->
    <path d="M560 360 C720 380 820 520 780 620 C754 684 700 720 640 700 C600 685 578 660 560 640"
          fill="none" stroke="url(#gTent)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" opacity="0.96"/>
    <path d="M620 370 C780 420 880 560 840 640 C820 690 760 720 700 700 C660 685 642 660 620 640"
          fill="none" stroke="url(#gTent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- Middle tentacles -->
    <path d="M480 420 C360 480 270 600 260 690 C256 720 280 746 320 740 C360 736 410 700 440 660"
          fill="none" stroke="url(#gTent)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" opacity="0.98"/>
    <path d="M520 430 C400 520 320 620 300 700 C292 728 310 749 350 746 C390 743 430 712 460 680"
          fill="none" stroke="url(#gTent)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.97"/>

    <!-- Front tentacles (overlapping, more detailed) -->
    <path d="M500 480 C560 610 610 680 680 720 C720 742 766 732 792 702 C812 678 805 640 780 620 C740 590 700 560 660 520"
          fill="none" stroke="url(#gTent)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
    <path d="M440 460 C380 580 340 640 300 680 C270 708 254 726 260 750 C268 782 310 790 352 774 C390 760 430 730 460 700"
          fill="none" stroke="url(#gTent)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>

    <!-- Suckers placed along two visible tentacles (using circles) -->
    <!-- On tentacle from (500,480) to (660,520) -->
    <g fill="url(#gSucker)" stroke="#6b3a45" stroke-width="1" opacity="0.95">
      <circle cx="570" cy="560" r="10"/>
      <circle cx="600" cy="580" r="12"/>
      <circle cx="630" cy="600" r="14"/>
      <circle cx="655" cy="610" r="11"/>
    </g>

    <!-- On tentacle from (440,460) to (460,700) -->
    <g fill="url(#gSucker)" stroke="#6b3a45" stroke-width="1" opacity="0.95">
      <circle cx="420" cy="540" r="9"/>
      <circle cx="390" cy="600" r="12"/>
      <circle cx="360" cy="645" r="13"/>
      <circle cx="340" cy="685" r="10"/>
    </g>

    <!-- Mantle / Head -->
    <g>
      <!-- Core shading shape -->
      <path d="M360 180
               C300 190 260 250 260 310
               C260 380 300 440 360 470
               C420 500 520 500 600 470
               C660 440 700 380 700 310
               C700 250 660 190 600 180
               C520 170 420 160 360 180 Z"
            fill="url(#gMantle)" stroke="#321318" stroke-width="6" stroke-linejoin="round"/>

      <!-- Texture overlay -->
      <path d="M360 180
               C300 190 260 250 260 310
               C260 380 300 440 360 470
               C420 500 520 500 600 470
               C660 440 700 380 700 310
               C700 250 660 190 600 180
               C520 170 420 160 360 180 Z"
            fill="url(#texture)" opacity="0.12"/>

      <!-- Soft specular highlight -->
      <ellipse cx="420" cy="245" rx="160" ry="90" fill="url(#gShine)" opacity="0.45" transform="rotate(-18 420 245)"/>

      <!-- Subtle rim light to emphasize form -->
      <path d="M608 192 C646 206 678 236 688 276" fill="none" stroke="rgba(255,200,220,0.12)" stroke-width="6" stroke-linecap="round"/>

      <!-- Eye left -->
      <g transform="translate(410,300)">
        <ellipse cx="0" cy="0" rx="34" ry="46" fill="url(#gEye)" stroke="#2f4150" stroke-width="3"/>
        <circle cx="-2" cy="6" r="16" fill="#0c1012"/>
        <circle cx="-5" cy="0" r="6" fill="#ffffff" opacity="0.95"/>
        <ellipse cx="6" cy="-12" rx="10" ry="5" fill="rgba(255,255,255,0.6)"/>
      </g>

      <!-- Eye right -->
      <g transform="translate(540,300)">
        <ellipse cx="0" cy="0" rx="28" ry="40" fill="url(#gEye)" stroke="#2f4150" stroke-width="3"/>
        <circle cx="-2" cy="8" r="13" fill="#0c1012"/>
        <circle cx="-4" cy="2" r="5" fill="#ffffff" opacity="0.95"/>
        <ellipse cx="4" cy="-10" rx="8" ry="4" fill="rgba(255,255,255,0.55)"/>
      </g>

      <!-- Mouth / beak hint under mantle -->
      <path d="M470 390 C490 410 530 410 550 392" fill="none" stroke="#2b1a1c" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Fine surface details: small mottles -->
    <g fill="#381f26" opacity="0.12">
      <circle cx="480" cy="220" r="6"/>
      <circle cx="500" cy="250" r="4"/>
      <circle cx="430" cy="260" r="5"/>
      <circle cx="560" cy="210" r="5"/>
      <circle cx="620" cy="240" r="4"/>
      <circle cx="380" cy="300" r="3"/>
    </g>

  </g>

  <!-- Foreground light caustic -->
  <g opacity="0.06" transform="translate(0,0)">
    <path d="M0 480 C180 420 320 460 520 440 C720 420 820 460 1024 420 L1024 768 L0 768 Z" fill="#99ffff"/>
  </g>

</svg>
