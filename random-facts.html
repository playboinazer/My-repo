<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interesting Random Facts</title>
  <meta name="description" content="A colorful page that shows interesting random facts with images related to each fact." />
  <style>
    :root{
      --bg1:#ff9a9e;
      --bg2:#fad0c4;
      --card:#ffffffcc;
      --accent1:#6a11cb;
      --accent2:#2575fc;
      --btn-text:#fff;
      --glass: rgba(255,255,255,0.18);
    }
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,system-ui,-apple-system,"Helvetica Neue",Arial;color:#1a1a1a}
    body{
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;align-items:center;justify-content:center;padding:40px;
    }
    .wrap{
      width:100%;max-width:960px;background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.75));border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.12);overflow:hidden;display:grid;grid-template-columns:1fr 420px;gap:0;
    }
    .main{
      padding:40px;display:flex;flex-direction:column;gap:20px;align-items:flex-start;justify-content:center;
    }
    h1{margin:0;font-size:2rem;line-height:1.05;color:#222}
    .fact-card{
      margin-top:8px;padding:22px;border-radius:14px;background:var(--card);width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.06);display:flex;gap:18px;align-items:flex-start;transition:transform 300ms cubic-bezier(.2,.9,.3,1);
    }
    .fact-card:hover{transform:translateY(-4px)}
    .fact-text{flex:1}
    .fact-text p{margin:0;font-size:1.125rem}
    .controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
    .btn{
      -webkit-tap-highlight-color: transparent;
      border:0;padding:12px 16px;border-radius:12px;color:var(--btn-text);cursor:pointer;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,0.12);transition:transform 140ms ease,box-shadow 140ms ease;
    }
    .btn:active{transform:translateY(1px);}
    .primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));}
    .secondary{background:linear-gradient(90deg,#ffd36b,#ff7aa2);color:#111}
    .muted{background:var(--glass);color:#111;border:1px solid rgba(255,255,255,0.45)}

    .sidebar{
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:100%;
    }
    .image-wrap{width:100%;height:320px;border-radius:12px;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center}
    .image-wrap img{width:100%;height:100%;object-fit:cover;display:block}

    .fade-enter{opacity:0;transform:translateY(8px)}
    .fade-enter-active{opacity:1;transform:none;transition:all 420ms cubic-bezier(.2,.9,.3,1)}

    @media(max-width:880px){
      .wrap{grid-template-columns:1fr;}
      .sidebar{order:-1}
      .image-wrap{height:220px}
    }
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <div class="main">
      <h1>Interesting Random Facts</h1>

      <div id="fact" class="fact-card" aria-live="polite">
        <div class="fact-text">
          <p id="fact-text">Loading a fun fact...</p>
        </div>
      </div>

      <div class="controls">
        <button id="newBtn" class="btn primary">Show another fact</button>
        <button id="surpriseBtn" class="btn secondary">Surprise me (related image)</button>
        <button id="shareBtn" class="btn muted">Copy share link</button>
      </div>
    </div>

    <aside class="sidebar">
      <div class="image-wrap" id="imageWrap">
        <img id="fact-img" src="https://images.unsplash.com/photo-1523978591478-c753949ff840?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder" alt="Fact image"/>
      </div>
    </aside>
  </div>

  <script>
    // Facts array with related images and optional keywords for better image matching.
    const facts = [
      { text: "Honey never spoils — archaeologists have found edible honey in ancient Egyptian tombs over 3,000 years old.", tag: "honey,ancient egypt", image: "https://images.unsplash.com/photo-1518972559570-9b78d4d3f3f2?q=80&w=1200&auto=format&fit=crop" },
      { text: "Octopuses have three hearts and blue blood.", tag: "octopus,marine animal", image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop" },
      { text: "Bananas are berries, but strawberries aren't.", tag: "banana,fruit", image: "https://images.unsplash.com/photo-1506806732259-39c2d0268443?q=80&w=1200&auto=format&fit=crop" },
      { text: "There are more possible iterations of a game of chess than atoms in the known universe (it's estimated).", tag: "chess,game", image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop" },
      { text: "A day on Venus is longer than a year on Venus — it rotates very slowly compared to its orbit around the Sun.", tag: "venus,space,planet", image: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1200&auto=format&fit=crop" },
      { text: "Wombat poop is cube-shaped — this helps it not to roll away when marking territory.", tag: "wombat,animal,australia", image: "https://images.unsplash.com/photo-1525253086316-d0c936c814f8?q=80&w=1200&auto=format&fit=crop" },
      { text: "A single strand of spaghetti is called a 'spaghetto'.", tag: "spaghetti,food,pasta", image: "https://images.unsplash.com/photo-1523986371872-9d3ba2e2f642?q=80&w=1200&auto=format&fit=crop" },
      { text: "Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid of Giza.", tag: "cleopatra,history,egypt", image: "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=1200&auto=format&fit=crop" }
    ];

    const factText = document.getElementById('fact-text');
    const factImg = document.getElementById('fact-img');
    const newBtn = document.getElementById('newBtn');
    const surpriseBtn = document.getElementById('surpriseBtn');
    const shareBtn = document.getElementById('shareBtn');

    function getRandomIndex(seed) {
      if (typeof seed === 'number') return seed % facts.length;
      return Math.floor(Math.random() * facts.length);
    }

    function showFact(idx, useRandomImage=false){
      const i = (typeof idx === 'number') ? idx : getRandomIndex();
      const fact = facts[i];

      factText.classList.add('fade-enter');
      setTimeout(()=>{
        factText.textContent = fact.text;
        // choose image: prefer the curated fact image so it's related
        if(useRandomImage){
          // request a related random image from Unsplash using tags/keywords
          const q = encodeURIComponent(fact.tag || fact.text.split(' ').slice(0,3).join(' '));
          factImg.src = `https://source.unsplash.com/1200x800/?${q}`;
        } else {
          factImg.src = fact.image;
        }
        // make alt text descriptive
        factImg.alt = fact.text.slice(0,80) + (fact.text.length>80? '...':'');
        requestAnimationFrame(()=>factText.classList.remove('fade-enter'));
      }, 120);

      // update URL hash for sharing
      const url = new URL(window.location.href);
      url.hash = 'fact=' + i + (useRandomImage ? '&r=1' : '');
      history.replaceState(null, '', url);
    }

    function parseHash(){
      try{
        const hash = location.hash.replace('#','');
        if(!hash) return null;
        const pairs = new URLSearchParams(hash.replace(/&/g,'&'));
        if(pairs.has('fact')){
          const idx = parseInt(pairs.get('fact'),10);
          const r = pairs.get('r');
          return { idx: isNaN(idx) ? null : idx, r: r === '1' };
        }
      }catch(e){/* ignore */}
      return null;
    }

    newBtn.addEventListener('click', ()=> showFact());
    surpriseBtn.addEventListener('click', ()=> showFact(undefined, true));
    shareBtn.addEventListener('click', ()=>{
      navigator.clipboard && navigator.clipboard.writeText(location.href).then(()=>{
        shareBtn.textContent = 'Link copied!';
        setTimeout(()=> shareBtn.textContent = 'Copy share link', 1600);
      }).catch(()=>{
        alert('Copy this link: ' + location.href);
      });
    });

    window.addEventListener('keydown', (e)=>{
      if(e.code === 'Space'){ e.preventDefault(); showFact(); }
    });

    window.addEventListener('load', ()=>{
      const parsed = parseHash();
      if(parsed && parsed.idx !== null){
        showFact(parsed.idx, parsed.r);
      } else showFact();
    });

    factImg.addEventListener('error', ()=>{
      factImg.src = 'https://picsum.photos/1200/800?random=1';
    });

  </script>
</body>
</html>
