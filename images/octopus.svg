<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Cute stylized octopus illustration</title>
  <desc id="desc">A colorful friendly octopus with eight tentacles, created as a vector illustration for the random facts site.</desc>
  <defs>
    <linearGradient id="bodyGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff6bcb"/>
      <stop offset="50%" stop-color="#8a5bff"/>
      <stop offset="100%" stop-color="#4dd2ff"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feBlend in="SourceGraphic" in2="b" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fbff"/>
  <!-- gentle ground shadow -->
  <ellipse cx="600" cy="700" rx="320" ry="60" fill="url(#shadow)" />

  <!-- octopus body -->
  <g transform="translate(600,360)">
    <!-- tentacles (back) -->
    <path d="M-260,160 C-210,120 -170,160 -120,140 C-70,120 -40,160 10,150" fill="none" stroke="url(#bodyGrad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" />
    <path d="M260,160 C210,120 170,160 120,140 C70,120 40,160 -10,150" fill="none" stroke="url(#bodyGrad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" />

    <!-- body main oval -->
    <ellipse cx="0" cy="-40" rx="260" ry="200" fill="url(#bodyGrad)" filter="url(#soft)"/>

    <!-- tentacles front -->
    <path d="M-220,140 C-180,200 -150,260 -120,300 C-90,340 -60,360 -20,340" fill="none" stroke="#ff8ad3" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-140,150 C-110,200 -60,240 -30,290 C0,340 40,360 80,340" fill="none" stroke="#a27bff" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M20,150 C50,200 110,240 150,290 C190,340 230,360 270,340" fill="none" stroke="#5fd9ff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

    <!-- face highlights -->
    <ellipse cx="-70" cy="-80" rx="28" ry="18" fill="#ffffff66" />
    <ellipse cx="70" cy="-80" rx="28" ry="18" fill="#ffffff66" />

    <!-- eyes -->
    <g transform="translate(-70,-60)">
      <circle cx="0" cy="0" r="34" fill="#fff" />
      <circle cx="6" cy="6" r="12" fill="#2b2b2b" />
    </g>
    <g transform="translate(70,-60)">
      <circle cx="0" cy="0" r="34" fill="#fff" />
      <circle cx="-6" cy="6" r="12" fill="#2b2b2b" />
    </g>

    <!-- mouth -->
    <path d="M-40,-20 C-20,10 20,10 40,-20" fill="none" stroke="#ff3b8a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- suckers detail on a front tentacle (stylized) -->
    <g transform="translate(-40,130) rotate(18)">
      <circle cx="0" cy="0" r="10" fill="#ffd6ec" />
      <circle cx="28" cy="14" r="9" fill="#ffd6ec" />
      <circle cx="56" cy="28" r="7" fill="#ffd6ec" />
    </g>

    <!-- glossy highlight on body -->
    <path d="M-180,-120 C-120,-160 -20,-170 60,-120 C110,-92 160,-50 190,-6" fill="none" stroke="#ffffff66" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  </g>

  <!-- small bubbles for underwater vibe -->
  <g fill="#bfe9ff" opacity="0.9">
    <circle cx="880" cy="120" r="12" />
    <circle cx="820" cy="160" r="8" />
    <circle cx="920" cy="180" r="6" />
    <circle cx="200" cy="120" r="10" />
    <circle cx="260" cy="160" r="6" />
  </g>

</svg>
